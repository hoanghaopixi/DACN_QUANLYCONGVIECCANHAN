# Server Configuration
server.port=8085
server.servlet.context-path=/api

# Timezone Configuration (Vietnam GMT+7)
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Spring Datasource Configuration (PostgreSQL 17.11)
spring.datasource.url=jdbc:postgresql://localhost:5432/quanlycongviec_db
spring.datasource.username=postgres
spring.datasource.password=q1a2z3x4
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
app.jwt.secret=9a4f2c8d3b7a1e6f4c5d2e8a7b9c1d3e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Google Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.model=gemini-3.5-flash-lite
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# Logging
logging.level.com.taskmanager=DEBUG
logging.level.org.springframework.security=INFO

# Server Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

# File Upload Configuration (supports images & background videos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads
