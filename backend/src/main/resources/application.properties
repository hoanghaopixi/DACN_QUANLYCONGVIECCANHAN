# Server Configuration
server.port=8085
server.servlet.context-path=/api

# Timezone Configuration (Vietnam GMT+7)
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Spring Datasource Configuration (PostgreSQL 17.11)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quanlycongviec_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:q1a2z3x4}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f4c5d2e8a7b9c1d3e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Google Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-3-flash-preview}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# CORS (comma-separated exact origins; never use a wildcard with bearer credentials)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.taskmanager=INFO
logging.level.org.springframework.security=WARN

# Server Error Handling
server.error.include-message=never
server.error.include-binding-errors=never

# File Upload Configuration (supports images & background videos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# Google OAuth2 Authentication
app.google.client-id=${GOOGLE_CLIENT_ID:465213819257-jqupte1qp12afa0bpngr44dsv49utdll.apps.googleusercontent.com}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}

